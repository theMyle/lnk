[project]
name = "lnk"
version = "0.1.0"
description = "A CLI utility for creating windows shortcuts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pywin32>=311",
    "typer>=0.19.2",
]

[project.scripts]
lnk = "lnk.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lnk"]