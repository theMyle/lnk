[project]
name = "lnk"
version = "0.1.1"
description = "A CLI utility for creating windows shortcuts"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pywin32>=311; sys_platform == 'win32'",
    "typer>=0.19.2",
]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "License :: OSI Approved :: MIT License",
]

[project.scripts]
lnk = "lnk.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lnk"]